[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "5.0.0"
description = "Offline URL risk analysis with reproducible phishing-detection research evaluation"
keywords = ["phishing", "url-analysis", "cybersecurity", "reproducible-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.128.2,<1.0",
  "uvicorn[standard]>=0.48.0,<1.0",
  "pydantic>=2.13.5,<3.0",
  "idna>=3.10,<4.0",
  "tldextract>=5.3.0,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0", "build>=1.2,<2.0", "pip-audit>=2.10.1,<3.0"]
research = ["scikit-learn>=1.8,<2.0"]

[project.scripts]
phishguard = "phishguard.cli:main"
phishguard-evaluate = "phishguard.research_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["phishguard*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
phishguard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
